<div class="page">
  <!-- Every Widget on the closed list, in its element or attribute form. The dataset IDs carry year-like digits on purpose. -->
  <ods-dataset-context context="datactx, geoctx" datactx-dataset="dvs_awt_econ_20250203" datactx-parameters="{'disjunctive.gemeinde_name': true}" geoctx-dataset="dvs_awt_regi_202502110">
    <div ods-facet-results="jahre" ods-facet-results-context="datactx" ods-facet-results-facet-name="datum" ods-facet-results-sort="-num">
      <ods-select options="jahre" label-modifier="name" value-modifier="name" selected-values="datactx.parameters['refine.datum']" placeholder="Jahr"></ods-select>
    </div>
    <ods-text-search context="datactx" placeholder="Suche"></ods-text-search>
    <div ods-adv-analysis="latest" ods-adv-analysis-context="datactx" ods-adv-analysis-select="max(datum) as datum">
      <p>{{ latest[0].datum | moment:'MMM YYYY' }}</p>
    </div>
    <div ods-aggregation="total" ods-aggregation-context="datactx" ods-aggregation-function="SUM" ods-aggregation-expression="logiernachte">
      <p>{{ total | number:0 }}</p>
    </div>
    <ods-gauge display-mode="circle" value="50" max="100"></ods-gauge>
    <ods-simple-tabs>
      <ods-simple-tab label="Diagramm">
        <ods-chart single-y-axis="true">
          <ods-chart-query context="datactx" field-x="gemeinde_name" category-colors="{'Chur': '#2D2D8A'}">
            <ods-chart-serie expression-y="logiernachte" chart-type="column" function-y="SUM" color="#2D2D8A"></ods-chart-serie>
          </ods-chart-query>
        </ods-chart>
      </ods-simple-tab>
      <ods-simple-tab label="Karte">
        <div ods-color-gradient="colors" ods-color-gradient-context="datactx" ods-color-gradient-x="gemeindenummer" ods-color-gradient-serie="SUM(logiernachte)" ods-color-gradient-low="#E7E7F2" ods-color-gradient-high="#2D2D8A">
          <ods-map scroll-wheel-zoom="false" toolbar-geolocation="false" toolbar-drawing="false">
            <ods-map-layer context="geoctx" display="categories" color-categories="colors['colors']" color-by-field="bfs_nummer" color-categories-other="#D9D9D6"></ods-map-layer>
          </ods-map>
          <ods-legend title="Logiernächte" display="linear" color-gradient="colors"></ods-legend>
        </div>
      </ods-simple-tab>
      <ods-simple-tab label="Tabelle">
        <ods-table context="datactx" displayed-fields="gemeinde_name,logiernachte"></ods-table>
        <ul ods-results="rows" ods-results-context="datactx" ods-results-max="50">
          <li ng-repeat="row in rows">{{ row.fields.gemeinde_name }}</li>
        </ul>
      </ods-simple-tab>
    </ods-simple-tabs>
  </ods-dataset-context>
</div>
