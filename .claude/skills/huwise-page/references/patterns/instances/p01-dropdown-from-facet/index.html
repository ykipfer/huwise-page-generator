<ods-dataset-context context="datactx"
    datactx-dataset="dvs_awt_educ_20251002"
    datactx-parameters="{'disjunctive.anlagetyp': true}">
  <div class="hw-page">
    <div class="hw-body hw-shape-single">
      <div class="hw-top">
        <div class="hw-kpis">
          <div class="hw-kpi" ods-aggregation="anlagen" ods-aggregation-context="datactx" ods-aggregation-function="COUNT">
            <p class="hw-kpi-value">{{ anlagen | number:0 }}</p>
            <p class="hw-kpi-label">Sportanlagen</p>
          </div>
        </div>
        <div class="hw-filters">
          <div class="hw-filter" ods-facet-results="anlagetypen" ods-facet-results-context="datactx"
               ods-facet-results-facet-name="anlagetyp" ods-facet-results-sort="alphanum">
            <p class="hw-filter-label">Anlagentyp</p>
            <ods-select options="anlagetypen" selected-values="datactx.parameters['refine.anlagetyp']"
                label-modifier="name + ' (' + count + ')'" value-modifier="name"
                placeholder="Alle Anlagentypen"></ods-select>
          </div>
        </div>
      </div>
      <div class="hw-card">
        <p class="hw-card-title">Sportanlagen nach Gemeinde</p>
        <div class="hw-chart-area">
          <ods-chart>
            <ods-chart-query context="datactx" field-x="gemeinde" maxpoints="0" sort="x">
              <ods-chart-serie chart-type="column" function-y="COUNT" label-y="Sportanlagen" color="#2D2D8A"></ods-chart-serie>
            </ods-chart-query>
          </ods-chart>
        </div>
      </div>
    </div>
    <div class="hw-footer">
      <span class="hw-footer-updated">Letzte Aktualisierung: {{ datactx.dataset.metas.data_processed | date:'dd.MM.yyyy' }}</span>
      <a href="https://data.gr.ch/explore/dataset/dvs_awt_educ_20251002/?flg=de-ch" target="_blank" rel="noopener noreferrer">Quelle: data.gr.ch</a>
    </div>
  </div>
</ods-dataset-context>
